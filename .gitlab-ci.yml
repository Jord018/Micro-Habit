stages:
  - sonar

sonarqube-check:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:latest

  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"

  script:
    - sonar-scanner
        -Dsonar.projectKey=Mirco-habit
        -Dsonar.sources=.
        -Dsonar.host.url=http://localhost:9000
        -Dsonar.login=$SONAR_TOKEN

  only:
    - development